<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf1e9" />
    <meta
      name="description"
      content="Presentación interactiva de análisis FODA y estrategias CAME desde el rol emprendedor."
    />
    <title>FODA + CAME | Proyecto emprendedor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main>
      <section class="workspace single-page" id="workspace" aria-label="Presentación de la matriz FODA y CAME">
        <header class="topbar">
          <div class="brand" aria-label="Proyecto emprendedor">
            <span class="brand-mark">f.</span><span>foda<span class="brand-plus">+</span></span>
          </div>
          <div class="top-actions">
            <a class="icon-button home-button" href="portada.html" aria-label="Volver a la portada" title="Volver a la portada">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 10 9-7 9 7M5.5 9v11h13V9M9 20v-6h6v6" />
              </svg>
            </a>
            <button class="button button-small button-dark" id="print-page" type="button"><span>Imprimir</span><span aria-hidden="true">↗</span></button>
          </div>
        </header>

        <div class="workspace-content">
          <section class="slide-heading" aria-labelledby="welcome-title">
            <div>
              <p class="eyebrow"><span class="eyebrow-dot"></span> DESARROLLO EMPRESARIAL · ACT. 1</p>
              <h1 id="welcome-title">FODA <span class="title-join">+</span> CAME</h1>
              <p class="slide-subtitle">Rol emprendedor <span>·</span> <span id="display-date"></span></p>
            </div>
            <div class="class-info">
              <span class="class-time">SOCIOS</span>
              <div class="team-avatar-list" id="team-avatars"></div>
            </div>
          </section>

          <section class="circle-board" aria-label="Ruta circular FODA a CAME">
            <svg class="orbit-lines" viewBox="0 0 1000 560" aria-hidden="true">
              <defs>
                <marker id="orbit-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                  <path d="M0 0 8 4 0 8Z" fill="#85a987" />
                </marker>
              </defs>
              <ellipse cx="500" cy="280" rx="340" ry="215" fill="none" stroke="#b9d1b3" stroke-width="3" stroke-dasharray="3 10" marker-end="url(#orbit-arrow)" />
              <path d="M500 55v40M840 280h-40M500 505v-40M160 280h40" stroke="#d6b36f" stroke-width="3" stroke-linecap="round" />
              <circle cx="500" cy="280" r="118" fill="#fffdf7" stroke="#e8e4d7" stroke-width="2" />
            </svg>
            <span class="orbit-letter orbit-letter-c" aria-label="Corregir">C</span>
            <span class="orbit-letter orbit-letter-a" aria-label="Afrontar">A</span>
            <span class="orbit-letter orbit-letter-m" aria-label="Mantener">M</span>
            <span class="orbit-letter orbit-letter-e" aria-label="Explotar">E</span>
            <div class="circle-center">
              <span class="center-spark" aria-hidden="true">✦</span>
              <span class="center-label">NUESTRA</span>
              <strong>IDEA</strong>
              <span class="center-divider"></span>
              <span class="center-route">FODA <b>→</b> CAME</span>
            </div>
            <div class="circle-cards" id="circle-cards"></div>
          </section>
          <footer class="workspace-footer"><span>ANALIZAR <b>·</b> DECIDIR <b>·</b> CRECER</span><span id="footer-project"></span></footer>
        </div>
      </section>

    </main>
  </body>
</html>
